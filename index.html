<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amalfi Desserts · Stock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
<style>
  :root{--bg:#fbf7f2;--card:#fff;--ink:#2b2118;--muted:#8a7b6d;--line:#eee3d6;--brand:#9c4a2f;--brand2:#f3e2d3;
        --ok:#2f7d4f;--okbg:#e6f4ea;--low:#b26b00;--lowbg:#fff3dc;--out:#b42318;--outbg:#fde7e5;}
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
  h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0}
  header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 16px 0}
  .top{display:flex;align-items:center;justify-content:space-between;gap:8px;max-width:980px;margin:0 auto}
  .top h1{font-size:22px} .top h1 span{color:var(--brand)}
  nav{display:flex;gap:4px;overflow-x:auto;max-width:980px;margin:10px auto 0}
  nav button{border:0;background:none;padding:10px 12px;font:inherit;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
  nav button.on{color:var(--brand);border-color:var(--brand);font-weight:600}
  main{max-width:980px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  .item h3{font-size:18px}
  .num{font-size:34px;font-weight:600;font-family:Fraunces,serif;margin:8px 0 2px}
  .sub{color:var(--muted);font-size:13px}
  .pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600}
  .ok{background:var(--okbg);color:var(--ok)} .low{background:var(--lowbg);color:var(--low)} .out{background:var(--outbg);color:var(--out)}
  .bar{height:6px;background:var(--line);border-radius:9px;margin:10px 0;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:9px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .between{justify-content:space-between}
  button.b{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font:inherit;cursor:pointer;color:var(--ink)}
  button.b:hover{border-color:var(--brand)}
  button.p{background:var(--brand);color:#fff;border-color:var(--brand)}
  button.s{padding:6px 10px;font-size:13px}
  button:disabled{opacity:.5;cursor:default}
  input,select{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-width:0}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{color:var(--muted);font-weight:500;font-size:13px}
  .banner{border-radius:12px;padding:12px 14px;margin-bottom:14px;background:var(--outbg);color:var(--out);font-weight:500}
  .banner.warn{background:var(--lowbg);color:var(--low)}
  .muted{color:var(--muted)} .hide{display:none!important}
  .auth{max-width:380px;margin:60px auto}
  .auth input{width:100%}
  .modal{position:fixed;inset:0;background:#2b211866;display:flex;align-items:flex-end;justify-content:center;z-index:20}
  .modal .card{width:100%;max-width:440px;border-radius:18px 18px 0 0;max-height:90vh;overflow:auto}
  @media(min-width:600px){.modal{align-items:center}.modal .card{border-radius:18px}}
  @media(max-width:520px){.top .sub{display:none}}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:30;font-size:14px}
  .section{margin-bottom:18px} .section h2{font-size:19px;margin-bottom:10px}
  code{background:var(--brand2);padding:2px 6px;border-radius:6px;font-size:12.5px;word-break:break-all}
  .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{flex:1;border:0;background:#fff;padding:9px;font:inherit;cursor:pointer}
  .seg button.on{background:var(--brand);color:#fff}
  .qty{display:flex;align-items:center;gap:6px}
  .qty button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:18px;cursor:pointer}
  .qty span{min-width:22px;text-align:center;font-weight:600}

  /* ---- simple mode ---- */
  body{font-size:18px}
  header.simple{padding:12px 16px}
  header.simple .top{justify-content:space-between}
  h1.small{font-size:20px}
  .back{border:0;background:none;font:inherit;color:var(--brand);font-weight:600;padding:8px 0;cursor:pointer}
  main.simple{padding:14px 14px 110px}
  nav.bottom{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));margin:0;max-width:none}
  nav.bottom button{flex:1;border:0;background:none;font:inherit;font-size:15px;color:var(--muted);padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:12px;cursor:pointer}
  nav.bottom button .ic{font-size:26px}
  nav.bottom button.on{color:var(--brand);font-weight:600;background:var(--brand2)}
  .alertbox{background:var(--outbg);color:var(--out);border-radius:16px;padding:16px;margin-bottom:14px;line-height:1.6}
  .alertbox b{display:block;font-size:20px;margin-bottom:4px}
  .okbox{background:var(--okbg);color:var(--ok)}
  .list{display:flex;flex-direction:column;gap:10px}
  .rowbtn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;font:inherit;color:var(--ink);cursor:pointer;min-height:76px}
  .rowbtn:active{background:var(--brand2)}
  .emoji{font-size:34px;line-height:1}
  .emoji.xl{font-size:56px}
  .mid{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
  .nm{font-weight:600;font-size:19px}
  .st{font-size:15px;font-weight:600}
  .big{font-family:Fraunces,serif;font-size:32px;font-weight:600;text-align:right;line-height:1}
  .big small{display:block;font-family:Inter;font-size:13px;font-weight:500;color:var(--muted)}
  .chev{font-size:30px;color:var(--muted)}
  .item-sheet{text-align:center;padding:6px 4px}
  .item-sheet h2{font-size:24px;margin:6px 0}
  .hugenum{font-family:Fraunces,serif;font-size:56px;font-weight:600;line-height:1.1}
  .hugenum small{font-family:Inter;font-size:17px;color:var(--muted);font-weight:500}
  .giant{display:block;width:100%;border:0;border-radius:16px;padding:20px;font:inherit;font-size:22px;font-weight:600;color:#fff;margin:10px 0;cursor:pointer}
  .giant.green{background:var(--ok)} .giant.red{background:var(--out)}
  .giant:disabled{opacity:.5}
  .plain{display:block;width:100%;border:0;background:none;font:inherit;color:var(--muted);padding:14px;cursor:pointer;font-size:17px}
  .q{font-weight:600;font-size:19px;margin:14px 0 10px}
  .stepper{display:flex;align-items:center;justify-content:center;gap:22px;margin:8px 0}
  .stepper button{width:72px;height:72px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:38px;color:var(--ink);cursor:pointer}
  .stepper span{font-family:Fraunces,serif;font-size:58px;font-weight:600;min-width:90px}
  .pills{display:flex;gap:8px;justify-content:center;margin:12px 0}
  .pills.wrap{flex-wrap:wrap;justify-content:flex-start}
  .pills button{border:2px solid var(--line);background:#fff;border-radius:99px;padding:12px 18px;font:inherit;font-size:17px;cursor:pointer;color:var(--ink)}
  .pills button.on{border-color:var(--brand);background:var(--brand);color:#fff;font-weight:600}
  .tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  @media(min-width:640px){.tiles{grid-template-columns:repeat(4,1fr)}}
  .tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 10px;border:2px solid var(--line);background:#fff;border-radius:16px;font:inherit;font-size:16px;font-weight:500;color:var(--ink);min-height:120px;cursor:pointer;justify-content:center;text-align:center}
  .tile.on{border-color:var(--ok);background:var(--okbg)}
  .badge{position:absolute;top:8px;right:8px;background:var(--ok);color:#fff;border-radius:99px;min-width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:18px}
  .sellbar{position:fixed;left:0;right:0;bottom:84px;padding:10px 14px;background:linear-gradient(transparent,var(--bg) 30%);display:flex;gap:8px;align-items:center;z-index:9}
  .sellbar .plain{width:auto}
  .sellbar .giant{margin:0}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<script>
const SUPABASE_URL = "https://byoufnhfuicamwqjdrkb.supabase.co";
const SUPABASE_KEY = "sb_publishable_7NkSIWCpWoIjnQW9TjRXGw_qvdoaEOR"; // publishable key: safe in the browser
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const S = { user:null, me:null, tab:"stock", stock:[], menu:[], recipes:[], moves:[], alerts:[], orders:[], staff:[], invites:[], settings:null };
const $ = (h) => { const t=document.createElement("template"); t.innerHTML=h.trim(); return t.content.firstChild; };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const n = (v) => Number(v) % 1 ? Number(v).toFixed(2).replace(/0+$/,"") : Number(v);
const pl = (w) => { w=String(w||""); return /(s|x|ch|sh)$/i.test(w) ? w+"es" : w+"s"; };
const plural = (q,u) => `${n(q)} ${Number(q)===1?u:pl(u)}`;
const when = (d) => new Date(d).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
const isOwner = () => S.me?.role === "owner";
function toast(msg){ const t=$(`<div class="toast">${esc(msg)}</div>`); document.body.append(t); setTimeout(()=>t.remove(),2600); }
function fail(e){ console.error(e); toast(e?.message || "Something went wrong"); }

// ---------- Auth ----------
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  S.user = session?.user ?? null;
  sb.auth.onAuthStateChange((_e, s) => { const was=S.user?.id; S.user = s?.user ?? null; if (was !== S.user?.id) start(); });
  start();
}
async function start(){
  if (!S.user) return renderAuth();
  const { data } = await sb.from("staff").select("*").eq("user_id", S.user.id).maybeSingle();
  S.me = data;
  if (!S.me) return renderNoAccess();
  await loadAll(); render(); listen();
}
function renderAuth(mode="in"){
  const app=document.getElementById("app"); app.innerHTML="";
  const el=$(`<div class="auth card">
    <h1 style="font-size:26px">Amalfi <span style="color:var(--brand)">Desserts</span></h1>
    <p class="muted" style="margin:6px 0 14px">Stock tracker</p>
    <div class="seg"><button data-m="in" class="${mode==="in"?"on":""}">Log in</button><button data-m="up" class="${mode==="up"?"on":""}">Create account</button></div>
    <form><label>Email</label><input name="email" type="email" required autocomplete="email">
    <label>Password</label><input name="pw" type="password" minlength="8" required autocomplete="${mode==="in"?"current-password":"new-password"}">
    <button class="b p" style="width:100%;margin-top:16px">${mode==="in"?"Log in":"Create account"}</button></form>
    <p class="sub" style="margin-top:12px">${mode==="up"?"The first account becomes the owner. Staff need an invite from the owner first.":""}</p>
    <p class="sub" id="msg"></p></div>`);
  el.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>renderAuth(b.dataset.m));
  el.querySelector("form").onsubmit=async(e)=>{
    e.preventDefault(); const f=new FormData(e.target); const email=f.get("email"), password=f.get("pw");
    const msg=el.querySelector("#msg"); msg.textContent="…";
    const r = mode==="in" ? await sb.auth.signInWithPassword({email,password})
                          : await sb.auth.signUp({email,password,options:{emailRedirectTo:location.href.split("#")[0]}});
    if (r.error) return msg.textContent = r.error.message;
    if (mode==="up" && !r.data.session) msg.textContent = "Check your email to confirm your account, then log in.";
  };
  app.append(el);
}
function renderNoAccess(){
  const app=document.getElementById("app"); app.innerHTML="";
  const el=$(`<div class="auth card"><h2>Nearly there</h2><p class="muted">You're signed in as ${esc(S.user.email)}, but you haven't been added to the shop yet. Ask the owner to invite this email, then sign up again with it.</p><button class="b">Log out</button></div>`);
  el.querySelector("button").onclick=()=>sb.auth.signOut(); app.append(el);
}

// ---------- Data ----------
async function loadAll(){
  const q = [
    sb.from("stock_levels").select("*").order("name"),
    sb.from("menu_items").select("*").order("name"),
    sb.from("menu_recipes").select("*"),
    sb.from("stock_movements").select("*, stock_items(name,unit)").order("created_at",{ascending:false}).limit(80),
    sb.from("alerts").select("*").is("resolved_at",null),
    sb.from("orders").select("*, order_lines(*)").order("placed_at",{ascending:false}).limit(40),
    sb.from("staff").select("*").order("created_at"),
  ];
  if (isOwner()) q.push(sb.from("staff_invites").select("*"), sb.from("app_settings").select("*").maybeSingle());
  const r = await Promise.all(q);
  const err = r.find(x=>x.error); if (err) fail(err.error);
  [S.stock,S.menu,S.recipes,S.moves,S.alerts,S.orders,S.staff] = r.slice(0,7).map(x=>x.data||[]);
  if (isOwner()) { S.invites=r[7].data||[]; S.settings=r[8].data; }
}
let rt;
function listen(){
  if (rt) sb.removeChannel(rt);
  let t; const refresh=()=>{ clearTimeout(t); t=setTimeout(async()=>{ await loadAll(); render(); },400); };
  rt = sb.channel("stock").on("postgres_changes",{event:"*",schema:"public",table:"stock_movements"},refresh)
         .on("postgres_changes",{event:"*",schema:"public",table:"alerts"},refresh).subscribe();
  setInterval(refresh, 60000);
}
async function addMove(stock_item_id, change, reason, note){
  const { error } = await sb.from("stock_movements").insert({ stock_item_id, change, reason, note, created_by:S.user.id });
  if (error) throw error;
}

// ---------- Words (ready for a second language later) ----------
const WORDS = {
  stock:"Stock", sold:"Sold", more:"More", good:"Good", low:"Running low", none:"None left",
  needOrder:(k)=> k===1 ? "1 thing needs ordering" : `${k} things need ordering`,
  allGood:"Everything is OK 👍", add:"Add", takeOut:"Take out", fixCount:"Fix the count",
  howMany:"How many?", save:"Save", cancel:"Cancel", used:"Used", thrown:"Thrown away",
  whereFrom:"Where was it sold?", shop:"Shop", tapToAdd:"Tap what was sold", done:"Done — take off stock",
  clear:"Clear", left:"left", history:"History", importOrders:"Upload delivery report", setup:"Settings", logout:"Log out",
  countNow:"How many are there now?",
};
const W = (k, ...a) => typeof WORDS[k] === "function" ? WORDS[k](...a) : WORDS[k];
const ICON = (name) => { const s=name.toLowerCase();
  if (s.includes("brownie")) return "🍫"; if (s.includes("cookie")) return "🍪"; if (s.includes("cheesecake")) return "🍰";
  if (s.includes("cake")) return "🎂"; if (s.includes("ice")) return "🍨"; if (s.includes("tub")) return "🥣";
  if (s.includes("box")||s.includes("sharer")) return "📦"; if (s.includes("donut")||s.includes("doughnut")) return "🍩"; return "🧁"; };
const STATUS = { ok:["good","var(--ok)"], low:["low","var(--low)"], out:["none","var(--out)"] };

// ---------- Layout ----------
const TABS = [["stock","🍰","stock"],["sell","🛵","sold"],["more","☰","more"]];
const SUB = { import:"importOrders", activity:"history", setup:"setup" };
function render(){
  const app=document.getElementById("app"); app.innerHTML="";
  const inSub = SUB[S.tab];
  const head=$(`<header class="simple"><div class="top">
    ${inSub ? `<button class="back" id="back">‹ ${W("more")}</button><h1 class="small">${W(SUB[S.tab])}</h1><span></span>`
            : `<h1>Amalfi <span>Desserts</span></h1>`}</div></header>`);
  head.querySelector("#back")?.addEventListener("click",()=>{S.tab="more";render();});
  const main=$(`<main class="simple"></main>`);
  const nav=$(`<nav class="bottom">${TABS.map(([k,ic,w])=>`<button data-t="${k}" class="${(S.tab===k||(k==="more"&&inSub))?"on":""}"><span class="ic">${ic}</span>${W(w)}</button>`).join("")}</nav>`);
  nav.querySelectorAll("button").forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;render();window.scrollTo(0,0);});
  app.append(head, main, nav);
  ({stock:viewStock,sell:viewSell,more:viewMore,import:viewImport,activity:viewActivity,setup:viewSetup})[S.tab](main);
}

// ---------- Stock (home) ----------
function viewStock(main){
  const active=S.stock.filter(s=>s.active);
  const need=active.filter(s=>s.status!=="ok").sort((a,b)=>Number(a.on_hand)-Number(b.on_hand));
  main.append(need.length
    ? $(`<div class="alertbox"><b>⚠️ ${W("needOrder",need.length)}</b><div>${need.map(s=>`${ICON(s.name)} ${esc(s.name)} — ${s.status==="out"?W("none"):plural(s.on_hand,s.unit)+" "+W("left")}`).join("<br>")}</div></div>`)
    : $(`<div class="alertbox okbox"><b>${W("allGood")}</b></div>`));
  if (!active.length) main.append($(`<p class="muted">No desserts added yet.</p>`));
  const list=$(`<div class="list"></div>`);
  for (const s of [...need, ...active.filter(x=>x.status==="ok")]){
    const [w,col]=STATUS[s.status];
    const r=$(`<button class="rowbtn"><span class="emoji">${ICON(s.name)}</span>
      <span class="mid"><span class="nm">${esc(s.name)}</span><span class="st" style="color:${col}">● ${W(w)}</span></span>
      <span class="big" style="color:${col}">${n(s.on_hand)}<small>${esc(pl(s.unit))}</small></span></button>`);
    r.onclick=()=>itemScreen(s.id);
    list.append(r);
  }
  main.append(list);
}

// Full-screen page for one dessert
function itemScreen(id){
  const s=S.stock.find(x=>x.id===id); if(!s) return;
  const [w,col]=STATUS[s.status];
  const m=modal(`<div class="item-sheet">
    <div class="emoji xl">${ICON(s.name)}</div><h2>${esc(s.name)}</h2>
    <div class="hugenum" style="color:${col}">${n(s.on_hand)} <small>${esc(pl(s.unit))} ${W("left")}</small></div>
    ${s.units_per_pack>1?`<div class="muted">= ${n(Math.floor(s.on_hand/s.units_per_pack*10)/10)} ${esc(s.pack_name||"packs")}</div>`:""}
    <div class="st" style="color:${col};margin:6px 0 18px">● ${W(w)}</div>
    <button class="giant green" data-k="in">➕ ${W("add")}</button>
    <button class="giant red" data-k="used">➖ ${W("takeOut")}</button>
    <button class="plain" data-k="count">✏️ ${W("fixCount")}</button>
    <button class="plain" id="c">${W("cancel")}</button></div>`);
  m.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>amountScreen(s,b.dataset.k));
  m.querySelector("#c").onclick=closeModal;
}
function amountScreen(s, kind){
  const hasPack = s.units_per_pack>1 && kind!=="count";
  let q = kind==="count" ? Math.max(0,Number(s.on_hand)) : 1, inPacks = hasPack && kind==="in", reason="used";
  const title = kind==="in" ? `➕ ${W("add")}` : kind==="used" ? `➖ ${W("takeOut")}` : `✏️ ${W("fixCount")}`;
  const m=modal(`<div class="item-sheet"><div class="emoji">${ICON(s.name)}</div><h2>${esc(s.name)}</h2>
    <p class="q">${kind==="count"?W("countNow"):W("howMany")}</p>
    <div class="stepper"><button id="minus">−</button><span id="qv"></span><button id="plus">+</button></div>
    ${hasPack?`<div class="pills" id="units"><button data-p="1">${esc(pl(s.pack_name||"pack"))}</button><button data-p="0">${esc(pl(s.unit))}</button></div><div class="muted" id="eq"></div>`:`<div class="muted">${esc(pl(s.unit))}</div>`}
    ${kind==="used"?`<div class="pills" id="why"><button data-r="used" class="on">${W("used")}</button><button data-r="waste">${W("thrown")}</button></div>`:""}
    <button class="giant ${kind==="used"?"red":"green"}" id="save">${W("save")}</button>
    <button class="plain" id="c">${W("cancel")}</button></div>`);
  const draw=()=>{ m.querySelector("#qv").textContent=n(q);
    m.querySelectorAll("#units button").forEach(b=>b.classList.toggle("on",(b.dataset.p==="1")===inPacks));
    const eq=m.querySelector("#eq"); if(eq) eq.textContent = inPacks ? `= ${n(q*s.units_per_pack)} ${pl(s.unit)}` : ""; };
  m.querySelector("#minus").onclick=()=>{ q=Math.max(0,q-1); draw(); };
  m.querySelector("#plus").onclick=()=>{ q+=1; draw(); };
  m.querySelectorAll("#units button").forEach(b=>b.onclick=()=>{ inPacks=b.dataset.p==="1"; draw(); });
  m.querySelectorAll("#why button").forEach(b=>b.onclick=()=>{ reason=b.dataset.r; m.querySelectorAll("#why button").forEach(x=>x.classList.toggle("on",x===b)); });
  m.querySelector("#c").onclick=closeModal;
  m.querySelector("#save").onclick=async(e)=>{
    const units = inPacks ? q*s.units_per_pack : q;
    let change, why;
    if (kind==="in"){ change=units; why="purchase"; } else if (kind==="used"){ change=-units; why=reason; } else { change=units-Number(s.on_hand); why="adjustment"; }
    if (!change) { closeModal(); return; }
    e.target.disabled=true;
    try { await addMove(s.id, change, why, null); closeModal(); toast(`✅ ${s.name}: ${change>0?"+":""}${n(change)}`); await loadAll(); render(); }
    catch(err){ e.target.disabled=false; fail(err); }
  };
  draw();
}

// ---------- Import ----------
function parseCSV(text){
  const rows=[]; let row=[], cell="", q=false;
  for (let i=0;i<text.length;i++){ const c=text[i];
    if (q){ if(c==='"'&&text[i+1]==='"'){cell+='"';i++;} else if(c==='"') q=false; else cell+=c; }
    else if (c==='"') q=true; else if (c===","){row.push(cell);cell="";} else if (c==="\n"||c==="\r"){ if(c==="\r"&&text[i+1]==="\n")i++; row.push(cell); rows.push(row); row=[]; cell=""; } else cell+=c; }
  if (cell||row.length){row.push(cell);rows.push(row);}
  return rows.filter(r=>r.some(x=>x.trim()));
}
function viewImport(main){
  const el=$(`<div class="card"><h2>Import delivery orders</h2>
    <p class="sub">Download your orders report (CSV) from Deliveroo, Uber Eats or Just Eat and drop it here. Orders already imported are skipped automatically.</p>
    <label>Which app is this from</label><select id="ch"><option value="deliveroo">Deliveroo</option><option value="ubereats">Uber Eats</option><option value="justeat">Just Eat</option><option value="other">Other</option></select>
    <label>CSV file</label><input type="file" id="f" accept=".csv,text/csv">
    <div id="map" style="margin-top:12px"></div><div id="res" style="margin-top:12px"></div></div>`);
  main.append(el);
  el.querySelector("#f").onchange=async(e)=>{
    const file=e.target.files[0]; if(!file) return;
    const rows=parseCSV(await file.text()); if(rows.length<2) return toast("That file looks empty");
    const head=rows[0].map(h=>h.trim()); const guess=(re)=>Math.max(0,head.findIndex(h=>re.test(h)));
    const opt=(sel)=>head.map((h,i)=>`<option value="${i}" ${i===sel?"selected":""}>${esc(h)}</option>`).join("");
    const map=el.querySelector("#map");
    map.innerHTML=`<p class="sub">${rows.length-1} rows found. Check which columns to use:</p>
      <label>Order number column</label><select id="co">${opt(guess(/order.*(id|num|#|ref)|^order$|^id$/i))}</select>
      <label>Item name column</label><select id="ci">${opt(guess(/item|product|dish|name/i))}</select>
      <label>Quantity column</label><select id="cq"><option value="-1">(each row = 1)</option>${opt(head.findIndex(h=>/qty|quantity|count/i.test(h)))}</select>
      <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="b p" id="go">Import</button></div>`;
    map.querySelector("#go").onclick=async(ev)=>{
      ev.target.disabled=true; const co=+map.querySelector("#co").value, ci=+map.querySelector("#ci").value, cq=+map.querySelector("#cq").value;
      const orders={};
      for (const r of rows.slice(1)){ const id=(r[co]||"").trim(), name=(r[ci]||"").trim(); if(!id||!name) continue;
        const qty = cq<0 ? 1 : Number(String(r[cq]).replace(/[^\d.]/g,""))||1;
        (orders[id] ||= []).push({name,qty}); }
      const ch=el.querySelector("#ch").value; let ok=0,dup=0; const unmatched=new Set();
      const res=el.querySelector("#res"); res.textContent="Importing…";
      for (const [id,lines] of Object.entries(orders)){
        const { data, error } = await sb.rpc("record_order",{p_channel:ch,p_external_id:id,p_lines:lines});
        if (error){ fail(error); break; }
        if (data.status==="duplicate") dup++; else { ok++; (data.unmatched||[]).forEach(u=>unmatched.add(u)); }
      }
      res.innerHTML=`<div class="banner warn" style="background:var(--okbg);color:var(--ok)">Imported ${ok} orders${dup?`, skipped ${dup} already imported`:""}.</div>`+
        (unmatched.size?`<div class="banner warn">These item names didn't match anything, so no stock was taken off for them: <b>${[...unmatched].map(esc).join(", ")}</b>. ${isOwner()?"Add them as a menu item or alias in Setup, then re-import won't double count.":"Ask the owner to add them in Setup."}</div>`:"");
      await loadAll();
    };
  };
}

  // Staff
  const sf=$(`<div class="section"><h2>Staff</h2><div class="card">
    <table><tbody>${S.staff.map(p=>`<tr><td>${esc(p.email)}</td><td>${p.role}</td><td>${p.user_id!==S.user.id?`<button class="b s" data-rm="${p.user_id}">Remove</button>`:'<span class="sub">you</span>'}</td></tr>`).join("")}
    ${S.invites.map(i=>`<tr class="muted"><td>${esc(i.email)}</td><td>invited</td><td><button class="b s" data-ri="${esc(i.email)}">Cancel</button></td></tr>`).join("")}</tbody></table>
    <form class="row" style="margin-top:12px"><input name="email" type="email" required placeholder="staff email" style="flex:1"><select name="role"><option value="staff">Staff</option><option value="owner">Owner</option></select><button class="b p">Invite</button></form>
    <p class="sub">After inviting, they open this page and choose "Create account" with that email.</p></div></div>`);
  sf.querySelector("form").onsubmit=async(e)=>{ e.preventDefault(); const f=new FormData(e.target);
    const { error } = await sb.from("staff_invites").upsert({email:String(f.get("email")).toLowerCase().trim(), role:f.get("role")}); if(error) return fail(error); toast("Invited"); await loadAll(); render(); };
  sf.querySelectorAll("[data-rm]").forEach(b=>b.onclick=async()=>{ const { error } = await sb.from("staff").delete().eq("user_id",b.dataset.rm); if(error) return fail(error); await loadAll(); render(); });
  sf.querySelectorAll("[data-ri]").forEach(b=>b.onclick=async()=>{ await sb.from("staff_invites").delete().eq("email",b.dataset.ri); await loadAll(); render(); });
  main.append(sf);

  // Alerts & connections
  const cfg=S.settings||{};

  const al=$(`<div class="section"><h2>Alerts &amp; delivery connection</h2><div class="card">

function itemDialog(s){
  const m=modal(`<h2>${s?"Edit":"New"} stock item</h2><form>
    <label>Name</label><input name="name" required value="${esc(s?.name)}" style="width:100%">
    <label>Counted in (singular)</label><input name="unit" required value="${esc(s?.unit||"slice")}" style="width:100%" placeholder="slice, piece, tub">
    <div class="row"><div style="flex:1"><label>Bought as (optional)</label><input name="pack" value="${esc(s?.pack_name||"")}" placeholder="whole cheesecake" style="width:100%"></div>
    <div style="width:110px"><label>…which is</label><input name="upp" type="number" min="1" step="any" value="${s?.units_per_pack||1}" style="width:100%"></div></div>
    <label>Alert me when it drops to</label><input name="low" type="number" min="0" step="any" value="${s?.low_level??5}" style="width:100%">
    ${s?`<label><input type="checkbox" name="active" ${s.active?"checked":""}> Active (untick to hide)</label>`:`<label>Starting amount (optional)</label><input name="start" type="number" min="0" step="any" style="width:100%">`}
    <div class="row" style="margin-top:16px;justify-content:flex-end"><button type="button" class="b" id="c">Cancel</button><button class="b p">Save</button></div></form>`);
  m.querySelector("#c").onclick=closeModal;
  m.querySelector("form").onsubmit=async(e)=>{ e.preventDefault(); const f=new FormData(e.target);
    const row={ name:f.get("name").trim(), unit:f.get("unit").trim(), pack_name:f.get("pack").trim()||null, units_per_pack:Number(f.get("upp"))||1, low_level:Number(f.get("low"))||0 };
    if (s) row.active=!!f.get("active");
    const r = s ? await sb.from("stock_items").update(row).eq("id",s.id).select().single() : await sb.from("stock_items").insert(row).select().single();
    if (r.error) return fail(r.error);
    if (!s && Number(f.get("start"))>0) await addMove(r.data.id, Number(f.get("start")), "opening", "Starting stock").catch(fail);
    closeModal(); toast("Saved"); await loadAll(); render(); };
}
function menuDialog(mi){
  const rec = mi ? S.recipes.filter(r=>r.menu_item_id===mi.id).map(r=>({...r})) : [];
  const m=modal(`<h2>${mi?"Edit":"New"} menu item</h2><form>
    <label>Name (as on the menu)</label><input name="name" required value="${esc(mi?.name)}" style="width:100%">
    <label>Also called (comma separated, optional)</label><input name="aliases" value="${esc((mi?.aliases||[]).join(", "))}" style="width:100%" placeholder="e.g. biscoff slice, lotus cheesecake">
    <label>Uses this stock</label><div id="rec"></div><button type="button" class="b s" id="addr" style="margin-top:6px">+ Add stock it uses</button>
    ${mi?`<label><input type="checkbox" name="active" ${mi.active?"checked":""}> Active</label>`:""}
    <div class="row" style="margin-top:16px;justify-content:flex-end"><button type="button" class="b" id="c">Cancel</button><button class="b p">Save</button></div></form>`);
  const box=m.querySelector("#rec");
  const draw=()=>{ box.innerHTML=""; rec.forEach((r,i)=>{ const row=$(`<div class="row" style="margin-bottom:6px"><select style="flex:1">${S.stock.map(s=>`<option value="${s.id}" ${s.id==r.stock_item_id?"selected":""}>${esc(s.name)}</option>`).join("")}</select><input type="number" min="0.01" step="any" value="${r.qty}" style="width:80px"><button type="button" class="b s">✕</button></div>`);
    row.querySelector("select").onchange=(e)=>r.stock_item_id=Number(e.target.value); row.querySelector("input").oninput=(e)=>r.qty=Number(e.target.value);
    row.querySelector("button").onclick=()=>{rec.splice(i,1);draw();}; box.append(row); }); };
  m.querySelector("#addr").onclick=()=>{ if(!S.stock.length) return toast("Add a stock item first"); rec.push({stock_item_id:S.stock[0].id,qty:1}); draw(); };
  draw();
  m.querySelector("#c").onclick=closeModal;
  m.querySelector("form").onsubmit=async(e)=>{ e.preventDefault(); const f=new FormData(e.target);
    const row={ name:f.get("name").trim(), aliases:String(f.get("aliases")).split(",").map(x=>x.trim().toLowerCase()).filter(Boolean) };
    if (mi) row.active=!!f.get("active");
    const r = mi ? await sb.from("menu_items").update(row).eq("id",mi.id).select().single() : await sb.from("menu_items").insert(row).select().single();
    if (r.error) return fail(r.error);
    const id=r.data.id;
    const del = await sb.from("menu_recipes").delete().eq("menu_item_id",id); if (del.error) return fail(del.error);
    const merged={}; rec.filter(x=>x.qty>0).forEach(x=>merged[x.stock_item_id]=(merged[x.stock_item_id]||0)+x.qty);
    const ins=Object.entries(merged).map(([sid,qty])=>({menu_item_id:id,stock_item_id:Number(sid),qty}));
    if (ins.length){ const r2=await sb.from("menu_recipes").insert(ins); if(r2.error) return fail(r2.error); }
    closeModal(); toast("Saved"); await loadAll(); render(); };
}
